[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robodata"
version = "0.1.0"
description = "Robot data and evaluation infrastructure with a RoboDojo code-policy pipeline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "requests>=2.32", "Pillow>=10", "PyYAML>=6", "imageio>=2.34"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
robodata = "robodata.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
